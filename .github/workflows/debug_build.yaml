name: Debug Jekyll Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with official pages builder image
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/github/workspace" \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e PAGES_REPO_NWO=${{ github.repository }} \
            -e GITHUB_TOKEN=${{ github.token }} \
            -e JEKYLL_ENV=production \
            -e INPUT_SOURCE=. \
            -e INPUT_DESTINATION=./_site \
            -e INPUT_FUTURE=false \
            -e INPUT_VERBOSE=true \
            -e INPUT_TOKEN=${{ github.token }} \
            -e INPUT_BUILD_REVISION=${{ github.sha }} \
            ghcr.io/actions/jekyll-build-pages:v1.0.13 > build.log 2>&1
          echo "JEKYLL_EXIT_CODE=$?" >> build.log
          set -e
          tail -40 build.log
      - name: Publish log to debug branch
        if: always()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug@localhost"
          sudo chown -R "$(id -u):$(id -g)" . || true
          mv build.log /tmp/build.log
          git checkout --orphan debug-log
          git rm -rf --cached . -q || true
          sudo git clean -fdx -q || true
          cp /tmp/build.log .
          git add build.log
          git commit -m "jekyll build log [skip ci]" -q
          git push -f origin debug-log
